
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diamond Price Predictor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      body {
        background-color: #2c2f33;
        color: #000;
      }
      .card {
        margin-top: 60px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .btn-primary {
        background-color: #007bff;
        border: none;
      }
      
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card p-4">
        <h2 class="text-center mb-5">Welcome to Diabetis Predictor</h2>
        <form action="/predict" method="post">

          <!-- Carat (Left) and Cut (Right) -->
          <div class="row mb-4">
            <div class="col-md-6">
              <label for="Pregnancies" class="form-label">Enter Pregnancies:</label>
              <input type="number" class="form-control" name="Pregnancies" id="Pregnancies"  placeholder="Enter Pregnancies">
            </div>

            <div class="col-md-6">
              <label for="Glucose" class="form-label">Select Glucose</label>
               <input type="number" class="form-control" name="Glucose" id="Glucose" step="0.1"  placeholder="Enter Glucose" required>
            </div>
          </div>

          
          <div class="row mb-4">
            <div class="col-md-6">
              <label for="BloodPressure" class="form-label">Enter BloodPressure:</label>
              <input type="number" class="form-control" id="BloodPressure" name="BloodPressure"
                     placeholder="Enter BloodPressure" required>
            </div>

             <div class="col-md-6">
              <label for="SkinThickness" class="form-label">Enter SkinThickness:</label>
              <input type="number" class="form-control" id="SkinThickness" name="SkinThickness"
                     placeholder="Enter SkinThickness" required>
            </div>
          </div>

           <div class="row mb-4">
            <div class="col-md-6">
              <label for="Insulin" class="form-label">Enter Insulin:</label>
              <input type="number" class="form-control" id="Insulin" name="Insulin"
                     placeholder="Enter Insulin" required>
            </div>

             <div class="col-md-6">
              <label for="BMI" class="form-label">Enter BMI:</label>
              <input type="number" class="form-control" id="BMI" name="BMI" step="0.1"
                     placeholder="Enter BMI" required>
            </div>
          </div>

           <div class="row mb-4">
            <div class="col-md-6">
              <label for="DiabetesPedigreeFunction" class="form-label">Enter DiabetesPedigreeFunction:</label>
              <input type="number" class="form-control" id="DiabetesPedigreeFunction" name="DiabetesPedigreeFunction" step="0.001"
                     placeholder="Enter DiabetesPedigreeFunction" required>
            </div>

             <div class="col-md-6">
              <label for="Age" class="form-label">Enter Age:</label>
              <input type="number" class="form-control" id="Age" name="Age"
                     placeholder="Enter Age" required>
            </div>
          </div>

          <!-- Predict Button -->
          <div class="row mb-5">
            <div class="col-md-12">
              <button type="submit" class="btn btn-primary w-100">Predict Diabetis</button>
            </div>
          </div>
        </form>

       {% if prediction %}
       <h3 style="color:blueviolet;text-align: center;">Prediction: {{ prediction }}</h3>
       {% endif %}

    
  </body>
</html>
